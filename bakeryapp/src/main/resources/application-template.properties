# ========================================
# BAKERY APP - CONFIGURATION TEMPLATE
# ========================================
# Copy this file to application.properties and fill in your actual values
# NEVER commit application.properties with real credentials to version control

spring.application.name=BakeryApp

# ========================================
# SERVER CONFIGURATION
# ========================================
server.port=8080

# ========================================
# DATABASE CONFIGURATION
# ========================================
# Replace with your actual database credentials
spring.datasource.url=jdbc:mysql://localhost:3306/bakery_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_password_here}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# JPA/HIBERNATE CONFIGURATION
# ========================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.open-in-view=false

# ========================================
# LOGGING CONFIGURATION
# ========================================
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.com.bakery.app=${LOG_LEVEL_APP:INFO}
logging.level.org.springdoc=${LOG_LEVEL_SPRINGDOC:INFO}
logging.level.org.hibernate=${LOG_LEVEL_HIBERNATE:WARN}

# ========================================
# SWAGGER/OPENAPI CONFIGURATION
# ========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
spring.jackson.serialization.fail-on-empty-beans=false
springdoc.model-and-view-allowed=true
springdoc.override-with-generic-response=false

# ========================================
# JWT CONFIGURATION
# ========================================
# Generate a secure random secret: openssl rand -base64 64
jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_A_SECURE_RANDOM_STRING_AT_LEAST_256_BITS}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ========================================
# EMAIL CONFIGURATION
# ========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password_here}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ========================================
# PASSWORD RESET CONFIGURATION
# ========================================
password.reset.token.expiry=${PASSWORD_RESET_EXPIRY:30}

# ========================================
# FRONTEND URL
# ========================================
frontend.url=${FRONTEND_URL:http://localhost:3000}

# ========================================
# ADMIN EMAIL
# ========================================
admin.email=${ADMIN_EMAIL:admin@bakery.com}
app.admin.email=${ADMIN_EMAIL:admin@bakery.com}

# ========================================
# RAZORPAY CONFIGURATION
# ========================================
# Get these from Razorpay Dashboard
razorpay.key.id=${RAZORPAY_KEY_ID:your_razorpay_key_id}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:your_razorpay_key_secret}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:your_webhook_secret}

# ========================================
# SECURITY CONFIGURATION
# ========================================
# Enable HTTPS in production
server.ssl.enabled=${SSL_ENABLED:false}
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=tomcat

# ========================================
# CORS CONFIGURATION
# ========================================
cors.allowed.origins=${CORS_ORIGINS:http://localhost:3000}

# ========================================
# ACTUATOR (Health Checks & Monitoring)
# ========================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true
