version: '3.8'

services:
  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: bakery-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - bakery-network

  # Grafana - Metrics Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: bakery-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboard.json:/etc/grafana/provisioning/dashboards/bakery.json
    ports:
      - "3001:3000"
    networks:
      - bakery-network
    depends_on:
      - prometheus

  # Node Exporter - System Metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: bakery-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - bakery-network

  # MySQL Exporter - Database Metrics
  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: bakery-mysql-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=root:${DB_PASSWORD}@(mysql:3306)/
    ports:
      - "9104:9104"
    networks:
      - bakery-network
    depends_on:
      - mysql

  # Alertmanager - Alert Management (Optional)
  alertmanager:
    image: prom/alertmanager:latest
    container_name: bakery-alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    networks:
      - bakery-network

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  bakery-network:
    external: true
